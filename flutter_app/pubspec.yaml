name: safety_app
description: "Women & Child Safety App - SOS, Location Sharing, Emergency Alerts"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter

  # UI & Icons
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1
  font_awesome_flutter: ^10.12.0

  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^14.2.0

  # Local Storage (Offline-first)
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.2.3

  # Location Services
  geolocator: ^12.0.0
  geocoding: ^3.0.0
  google_maps_flutter: ^2.6.1

  # Networking
  dio: ^5.4.3+1
  web_socket_channel: ^3.0.0
  connectivity_plus: ^6.0.3

  # Backend (Supabase)
  supabase_flutter: ^2.5.6

  # Sensors (Shake detection)
  sensors_plus: ^5.0.1

  # Permissions
  permission_handler: ^11.3.1

  # SMS (using url_launcher for SMS - telephony discontinued)
  # SMS will be sent via url_launcher sms: scheme

  # Notifications
  flutter_local_notifications: ^18.0.0
  firebase_messaging: ^15.0.0
  firebase_core: ^3.5.0

  # Camera & Audio
  camera: ^0.11.0+1
  record: ^6.2.0
  audioplayers: ^6.0.0

  # Utils
  uuid: ^4.4.0
  intl: ^0.19.0
  url_launcher: ^6.2.6
  path_provider: ^2.1.2
  share_plus: ^10.1.0
  file_picker: ^8.0.0
  path: ^1.9.0
  crypto: ^3.0.3

  # Environment Variables
  flutter_dotenv: ^5.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  riverpod_generator: ^2.4.0
  build_runner: ^2.4.9
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/images/
    - assets/icons/
    - assets/sounds/
